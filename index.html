<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ms. Chahal's Homework Checks</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Custom Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col items-center justify-center p-4">

    <!-- MAIN CARD CONTAINER -->
    <div class="w-full max-w-lg bg-white rounded-3xl shadow-xl border border-slate-200/80 p-6 sm:p-8 flex flex-col items-center relative">
        
        <!-- HEADER -->
        <div class="text-center mb-6">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
                Ms. Chahal's Homework Checks
            </h1>
            <p class="text-sm text-slate-500 font-medium mt-1">Spin the wheel to see if today is a homework check!</p>
        </div>

        <!-- WHEEL & CONTROLS CONTAINER -->
        <div class="relative w-full flex flex-col items-center">
            
            <!-- POINTER / TICKER -->
            <div id="pointer" class="absolute -top-3 z-10 w-8 h-10 transition-transform duration-75 origin-top flex justify-center">
                <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[28px] border-t-amber-500 drop-shadow-md"></div>
            </div>

            <!-- CANVAS WHEEL -->
            <div class="relative p-2 bg-slate-200/60 rounded-full shadow-inner">
                <canvas id="wheelCanvas" width="380" height="380" class="max-w-full h-auto rounded-full"></canvas>
            </div>

            <!-- SPIN BUTTON -->
            <button id="spinBtn" class="mt-6 w-full max-w-xs py-4 px-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-extrabold text-lg rounded-2xl shadow-lg shadow-blue-500/25 active:scale-95 transition-all flex items-center justify-center gap-2 cursor-pointer">
                <i data-lucide="rotate-cw" class="w-5 h-5"></i>
                SPIN THE WHEEL
            </button>

            <!-- EXTRA CONTROLS (SPEED & SOUND) -->
            <div class="flex items-center justify-between w-full mt-6 pt-4 border-t border-slate-100 text-xs text-slate-500">
                <!-- SPEED MODE TOGGLES -->
                <div class="flex items-center gap-1">
                    <span class="font-bold mr-1">Speed:</span>
                    <button data-speed="slow" class="spin-speed-btn px-2.5 py-1 rounded-lg bg-white text-slate-700 font-semibold border border-slate-200 shadow-sm">Slow</button>
                    <button data-speed="normal" class="spin-speed-btn px-2.5 py-1 rounded-lg bg-blue-600 text-white font-semibold border border-blue-600 shadow-sm">Normal</button>
                    <button data-speed="fast" class="spin-speed-btn px-2.5 py-1 rounded-lg bg-white text-slate-700 font-semibold border border-slate-200 shadow-sm">Fast</button>
                </div>

                <!-- SOUND TOGGLE BUTTON -->
                <button id="soundToggleBtn" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 font-semibold text-slate-700 transition">
                    <i data-lucide="volume-2" id="soundIcon" class="w-4 h-4 text-blue-600"></i>
                    <span id="soundText">Sound ON</span>
                </button>
            </div>

        </div>
    </div>

    <!-- RESULT MODAL -->
    <div id="resultModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="resultCard" class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl transform scale-90 transition-transform duration-300 border border-slate-100">
            <div id="modalIconContainer" class="w-20 h-20 mx-auto rounded-2xl flex items-center justify-center mb-4">
                <i id="modalIcon" class="w-10 h-10"></i>
            </div>
            <h2 id="modalTitle" class="text-3xl font-extrabold mb-2 tracking-tight"></h2>
            <p id="modalDescription" class="text-slate-600 text-sm mb-6 leading-relaxed"></p>
            <button id="closeModalBtn" class="w-full py-3.5 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-xl shadow-md active:scale-95 transition">
                Continue
            </button>
        </div>
    </div>

    <!-- WHEEL GAME LOGIC -->
    <script>
        const sectors = [
            { id: 1, label: "Homework Check!", isCheck: true, color: "#ef4444", textColor: "#ffffff" },
            { id: 2, label: "Safe", isCheck: false, color: "#10b981", textColor: "#ffffff" },
            { id: 3, label: "Homework Check!", isCheck: true, color: "#ef4444", textColor: "#ffffff" },
            { id: 4, label: "Safe", isCheck: false, color: "#3b82f6", textColor: "#ffffff" },
            { id: 5, label: "Safe", isCheck: false, color: "#8b5cf6", textColor: "#ffffff" }
        ];

        let currentAngle = 0;
        let angularVelocity = 0;
        let isSpinning = false;
        let spinSpeedMode = "normal";
        let soundEnabled = true;

        // AUDIO SYSTEM (Web Audio API)
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTickSound() {
            if (!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600 + Math.random() * 200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        function playSafeSound() {
            if (!soundEnabled) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                freqs.forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + i * 0.08);
                    gain.gain.setValueAtTime(0.2, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.3);
                });
            } catch (e) {}
        }

        function playCheckSound() {
            if (!soundEnabled) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(260, now);
                osc.frequency.linearRampToValueAtTime(130, now + 0.5);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.55);
            } catch (e) {}
        }

        // CANVAS WHEEL DRAWING
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numSectors = sectors.length;
        const arc = (2 * Math.PI) / numSectors;

        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = width / 2 - 12;

            ctx.clearRect(0, 0, width, height);

            // Outer ring
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 8, 0, 2 * Math.PI);
            ctx.fillStyle = '#f1f5f9';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#cbd5e1';
            ctx.stroke();

            // Draw sectors
            for (let i = 0; i < numSectors; i++) {
                const sectorAngle = currentAngle + i * arc;
                const sector = sectors[i];

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, sectorAngle, sectorAngle + arc);
                ctx.closePath();

                ctx.fillStyle = sector.color;
                ctx.fill();

                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Sector text (Strictly plain text, no emojis)
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(sectorAngle + arc / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = sector.textColor;
                ctx.font = "bold 16px 'Plus Jakarta Sans', sans-serif";
                ctx.fillText(sector.label, radius - 25, 0);
                ctx.restore();
            }

            // Draw pegs
            for (let i = 0; i < numSectors; i++) {
                const pegAngle = currentAngle + i * arc;
                const pegX = centerX + (radius - 4) * Math.cos(pegAngle);
                const pegY = centerY + (radius - 4) * Math.sin(pegAngle);

                ctx.beginPath();
                ctx.arc(pegX, pegY, 5.5, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = '#94a3b8';
                ctx.stroke();
            }
        }

        let lastPegIndex = -1;

        function animateWheel() {
            if (isSpinning) {
                angularVelocity *= 0.9912;

                if (angularVelocity < 0.001) {
                    angularVelocity = 0;
                    isSpinning = false;
                    onSpinComplete();
                }

                currentAngle += angularVelocity;
                currentAngle %= (2 * Math.PI);

                const pointerAngle = (3 * Math.PI / 2);
                let normalizedAngle = (pointerAngle - currentAngle) % (2 * Math.PI);
                if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

                const currentPegIndex = Math.floor(normalizedAngle / arc);

                if (currentPegIndex !== lastPegIndex) {
                    lastPegIndex = currentPegIndex;
                    playTickSound();
                    
                    const pointerEl = document.getElementById('pointer');
                    pointerEl.style.transform = 'rotate(-15deg)';
                    setTimeout(() => {
                        pointerEl.style.transform = 'rotate(0deg)';
                    }, 50);
                }
            }

            drawWheel();
            requestAnimationFrame(animateWheel);
        }

        function startSpin() {
            if (isSpinning) return;
            initAudio();

            let baseSpeed = 0.35;
            if (spinSpeedMode === "slow") baseSpeed = 0.22;
            if (spinSpeedMode === "fast") baseSpeed = 0.55;

            angularVelocity = baseSpeed + Math.random() * 0.15;
            isSpinning = true;

            document.getElementById('spinBtn').classList.add('opacity-50', 'pointer-events-none');
        }

        function onSpinComplete() {
            document.getElementById('spinBtn').classList.remove('opacity-50', 'pointer-events-none');

            const pointerAngle = (3 * Math.PI / 2);
            let winningAngle = (pointerAngle - currentAngle) % (2 * Math.PI);
            if (winningAngle < 0) winningAngle += 2 * Math.PI;

            const winningIndex = Math.floor(winningAngle / arc);
            const winningSector = sectors[winningIndex];

            showResultModal(winningSector);
        }

        function showResultModal(sector) {
            const modal = document.getElementById('resultModal');
            const card = document.getElementById('resultCard');
            const iconContainer = document.getElementById('modalIconContainer');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDescription');

            if (sector.isCheck) {
                playCheckSound();
                iconContainer.classList.add('hidden');
                title.textContent = "HOMEWORK CHECK!";
                title.className = "text-3xl font-extrabold mb-2 text-red-600 tracking-tight mt-4";
                desc.textContent = "Time to get those homework notebooks open! Ms. Chahal is checking homework today.";
            } else {
                playSafeSound();
                confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
                iconContainer.classList.remove('hidden');
                iconContainer.className = "w-20 h-20 mx-auto rounded-2xl flex items-center justify-center mb-4 border border-emerald-200 bg-emerald-50 text-emerald-600 shadow-sm";
                document.getElementById('modalIcon').setAttribute('data-lucide', 'shield-check');
                title.textContent = "SAFE!";
                title.className = "text-3xl font-extrabold mb-2 text-emerald-600 tracking-tight";
                desc.textContent = "No homework check for today's spin! Enjoy the rest of class.";
            }

            lucide.createIcons();
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-90');
            card.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('resultModal');
            const card = document.getElementById('resultCard');
            card.classList.remove('scale-100');
            card.classList.add('scale-90');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        // EVENT LISTENERS
        document.getElementById('spinBtn').addEventListener('click', startSpin);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target === document.body) {
                e.preventDefault();
                startSpin();
            }
        });

        document.querySelectorAll('.spin-speed-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.spin-speed-btn').forEach(b => {
                    b.className = 'spin-speed-btn px-2.5 py-1 rounded-lg bg-white text-slate-700 font-semibold border border-slate-200 shadow-sm';
                });
                e.target.className = 'spin-speed-btn px-2.5 py-1 rounded-lg bg-blue-600 text-white font-semibold border border-blue-600 shadow-sm';
                spinSpeedMode = e.target.getAttribute('data-speed');
            });
        });

        document.getElementById('soundToggleBtn').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');

            if (soundEnabled) {
                icon.setAttribute('data-lucide', 'volume-2');
                icon.className = 'w-4 h-4 text-blue-600';
                text.textContent = 'Sound ON';
            } else {
                icon.setAttribute('data-lucide', 'volume-x');
                icon.className = 'w-4 h-4 text-slate-400';
                text.textContent = 'Muted';
            }
            lucide.createIcons();
        });

        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('resultModal').addEventListener('click', (e) => {
            if (e.target.id === 'resultModal') closeModal();
        });

        window.onload = function() {
            lucide.createIcons();
            requestAnimationFrame(animateWheel);
        };
    </script>
</body>
</html>
