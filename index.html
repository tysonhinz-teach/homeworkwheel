<!-- JAVASCRIPT GAME & INTERACTION LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // APP CONFIGURATION
        const customFirebaseConfig = {
            apiKey: "AIzaSyDHmL6x6Rg62D8_4yFm59VYKQm_XBk5ifo",
            authDomain: "wheel-2-b5643.firebaseapp.com",
            databaseURL: "https://wheel-2-b5643-default-rtdb.firebaseio.com",
            projectId: "wheel-2-b5643",
            storageBucket: "wheel-2-b5643.firebasestorage.app",
            messagingSenderId: "425047161672",
            appId: "1:425047161672:web:22841d98d442d6a521d17d"
        };

        const sectors = [
            { id: 1, label: "Homework Check!", isCheck: true, color: "#ef4444", textColor: "#ffffff" },
            { id: 2, label: "Safe", isCheck: false, color: "#10b981", textColor: "#ffffff" },
            { id: 3, label: "Safe", isCheck: false, color: "#3b82f6", textColor: "#ffffff" },
            { id: 4, label: "Safe", isCheck: false, color: "#8b5cf6", textColor: "#ffffff" },
            { id: 5, label: "Safe", isCheck: false, color: "#f59e0b", textColor: "#ffffff" }
        ];

        let currentAngle = 0;
        let angularVelocity = 0;
        let isSpinning = false;
        let spinSpeedMode = "normal";
        let soundEnabled = true;

        // Load initial values from Browser Storage immediately
        let totalSpins = parseInt(localStorage.getItem('hinz_totalSpins') || '0', 10);
        let checkedCount = parseInt(localStorage.getItem('hinz_checkedCount') || '0', 10);

        let db = null;
        let auth = null;
        let statsDocRef = null;

        function updateCloudStatus(status, message = '') {
            const badge = document.getElementById('cloudStatusBadge');
            const dot = document.getElementById('cloudStatusDot');
            const text = document.getElementById('cloudStatusText');
            if (!badge || !dot || !text) return;

            if (status === 'connected') {
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                text.textContent = "Cloud Sync Active";
                badge.className = "flex items-center gap-1.5 px-3 py-2 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold";
                badge.title = "Connected! Data syncs to Firebase.";
                badge.onclick = null;
            } else if (status === 'error') {
                dot.className = "w-2.5 h-2.5 rounded-full bg-amber-500";
                text.textContent = "Saved to Browser";
                badge.className = "flex items-center gap-1.5 px-3 py-2 rounded-xl bg-amber-50 text-amber-700 border border-amber-200 text-xs font-bold cursor-pointer";
                badge.title = "Click to view details";
                badge.onclick = () => alert("Note on Sync:\n\nSpins are currently saving safely to this browser. Firebase error:\n" + message);
            } else {
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500";
                text.textContent = "Saved to Browser";
                badge.className = "flex items-center gap-1.5 px-3 py-2 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold";
                badge.title = "Spins save automatically in this browser.";
                badge.onclick = null;
            }
        }

        async function initCloudStorage() {
            updateStatsUI(); // Immediately display browser-saved stats

            if (!customFirebaseConfig || !customFirebaseConfig.apiKey) {
                updateCloudStatus('local');
                return;
            }

            try {
                const app = initializeApp(customFirebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                try {
                    await signInAnonymously(auth);
                } catch (authErr) {
                    updateCloudStatus('error', 'Anonymous Auth disabled in Firebase console.');
                    return;
                }

                statsDocRef = doc(db, 'wheel_data', 'hinz_homework_stats');

                // Real-time synchronization with smart merge
                onSnapshot(statsDocRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.data();
                        const cloudSpins = data.totalSpins || 0;
                        const cloudChecked = data.checkedCount || 0;

                        // Keep whichever value is higher so spins are never lost
                        if (cloudSpins >= totalSpins) {
                            totalSpins = cloudSpins;
                            checkedCount = cloudChecked;
                            localStorage.setItem('hinz_totalSpins', totalSpins);
                            localStorage.setItem('hinz_checkedCount', checkedCount);
                            updateStatsUI();
                        } else {
                            // Local data is ahead of cloud, push local data to cloud
                            saveStatsToCloud();
                        }
                    } else {
                        // First time setup in Firestore
                        saveStatsToCloud();
                    }
                    updateCloudStatus('connected');
                }, (err) => {
                    updateCloudStatus('error', err.message);
                });
            } catch (err) {
                updateCloudStatus('error', err.message);
            }
        }

        async function saveStatsToCloud() {
            // 1. Always save to local browser storage instantly
            localStorage.setItem('hinz_totalSpins', totalSpins);
            localStorage.setItem('hinz_checkedCount', checkedCount);

            // 2. Push to Firestore if connected
            if (!db || !statsDocRef) return;
            try {
                await setDoc(statsDocRef, {
                    totalSpins: totalSpins,
                    checkedCount: checkedCount,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
            } catch (err) {
                console.warn("Could not save to cloud, saved locally instead:", err);
            }
        }

        // --- AUDIO SYSTEM ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTickSound() {
            if (!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600 + Math.random() * 200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        function playSafeSound() {
            if (!soundEnabled) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                freqs.forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + i * 0.08);
                    gain.gain.setValueAtTime(0.2, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.3);
                });
            } catch (e) {}
        }

        function playCheckSound() {
            if (!soundEnabled) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(260, now);
                osc.frequency.linearRampToValueAtTime(130, now + 0.5);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.55);
            } catch (e) {}
        }

        // --- CANVAS WHEEL ---
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numSectors = sectors.length;
        const arc = (2 * Math.PI) / numSectors;

        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = width / 2 - 12;

            ctx.clearRect(0, 0, width, height);

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius + 8, 0, 2 * Math.PI);
            ctx.fillStyle = '#f1f5f9';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#cbd5e1';
            ctx.stroke();

            for (let i = 0; i < numSectors; i++) {
                const sectorAngle = currentAngle + i * arc;
                const sector = sectors[i];

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, sectorAngle, sectorAngle + arc);
                ctx.closePath();

                ctx.fillStyle = sector.color;
                ctx.fill();

                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(sectorAngle + arc / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = sector.textColor;

                if (sector.isCheck) {
                    ctx.font = "bold 16px 'Plus Jakarta Sans', sans-serif";
                    ctx.fillText("🚨 " + sector.label, radius - 22, 0);
                } else {
                    ctx.font = "bold 20px 'Plus Jakarta Sans', sans-serif";
                    ctx.fillText("✅ " + sector.label, radius - 30, 0);
                }

                ctx.restore();
            }

            for (let i = 0; i < numSectors; i++) {
                const pegAngle = currentAngle + i * arc;
                const pegX = centerX + (radius - 4) * Math.cos(pegAngle);
                const pegY = centerY + (radius - 4) * Math.sin(pegAngle);

                ctx.beginPath();
                ctx.arc(pegX, pegY, 5.5, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = '#94a3b8';
                ctx.stroke();
            }
        }

        let lastPegIndex = -1;

        function animateWheel() {
            if (isSpinning) {
                angularVelocity *= 0.9912;

                if (angularVelocity < 0.001) {
                    angularVelocity = 0;
                    isSpinning = false;
                    onSpinComplete();
                }

                currentAngle += angularVelocity;
                currentAngle %= (2 * Math.PI);

                const pointerAngle = (3 * Math.PI / 2);
                let normalizedAngle = (pointerAngle - currentAngle) % (2 * Math.PI);
                if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

                const currentPegIndex = Math.floor(normalizedAngle / arc);

                if (currentPegIndex !== lastPegIndex) {
                    lastPegIndex = currentPegIndex;
                    playTickSound();
                    
                    const pointerEl = document.getElementById('pointer');
                    pointerEl.style.transform = 'rotate(-15deg)';
                    setTimeout(() => {
                        pointerEl.style.transform = 'rotate(0deg)';
                    }, 50);
                }
            }

            drawWheel();
            requestAnimationFrame(animateWheel);
        }

        function startSpin() {
            if (isSpinning) return;
            initAudio();

            let baseSpeed = 0.35;
            if (spinSpeedMode === "slow") baseSpeed = 0.22;
            if (spinSpeedMode === "fast") baseSpeed = 0.55;

            angularVelocity = baseSpeed + Math.random() * 0.15;
            isSpinning = true;

            document.getElementById('spinBtn').classList.add('opacity-50', 'pointer-events-none');
        }

        function onSpinComplete() {
            document.getElementById('spinBtn').classList.remove('opacity-50', 'pointer-events-none');

            const pointerAngle = (3 * Math.PI / 2);
            let winningAngle = (pointerAngle - currentAngle) % (2 * Math.PI);
            if (winningAngle < 0) winningAngle += 2 * Math.PI;

            const winningIndex = Math.floor(winningAngle / arc);
            const winningSector = sectors[winningIndex];

            totalSpins++;
            if (winningSector.isCheck) {
                checkedCount++;
            }

            updateStatsUI();
            saveStatsToCloud();
            showResultModal(winningSector);
        }

        function updateStatsUI() {
            document.getElementById('statTotalSpins').textContent = totalSpins;
            document.getElementById('statCheckedCount').textContent = checkedCount;

            const expRatio = totalSpins > 0 ? (checkedCount / totalSpins) : 0;
            const expPercentStr = (expRatio * 100).toFixed(1) + "% (" + checkedCount + "/" + totalSpins + ")";
            
            document.getElementById('statExpPercent').textContent = expPercentStr;
            document.getElementById('statExpBar').style.width = Math.min(100, (expRatio * 100)) + "%";

            const lawText = document.getElementById('lawOfLargeNumbersText');
            if (totalSpins === 0) {
                lawText.textContent = "Theoretical probability predicts what should happen mathematically (20%). Experimental probability shows what actually happens during your spins.";
            } else if (totalSpins < 10) {
                lawText.textContent = `Small sample size (${totalSpins} spins). Experimental probability can vary from the theoretical 20%!`;
            } else if (totalSpins < 25) {
                lawText.textContent = `Notice how with ${totalSpins} spins, the experimental probability starts getting closer to the theoretical 20%.`;
            } else {
                lawText.textContent = `Great dataset (${totalSpins} spins)! As the number of trials increases, experimental probability approaches theoretical probability.`;
            }
        }

        function showResultModal(sector) {
            const modal = document.getElementById('resultModal');
            const card = document.getElementById('resultCard');
            const iconContainer = document.getElementById('modalIconContainer');
            const icon = document.getElementById('modalIcon');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDescription');
            const badge = document.getElementById('modalOutcomeBadge');

            if (sector.isCheck) {
                playCheckSound();
                iconContainer.className = "w-20 h-20 mx-auto rounded-2xl flex items-center justify-center mb-4 border border-red-200 bg-red-50 text-red-600 shadow-sm";
                icon.setAttribute('data-lucide', 'alert-triangle');
                title.textContent = "HOMEWORK CHECK!";
                title.className = "text-3xl font-extrabold mb-2 text-red-600 tracking-tight";
                desc.textContent = "Time to get those math notebooks open! Mr. Hinz is checking homework solutions.";
                badge.textContent = "Homework Check (1 in 5 = 20% Chance)";
                badge.className = "font-bold text-red-600";
            } else {
                playSafeSound();
                confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
                iconContainer.className = "w-20 h-20 mx-auto rounded-2xl flex items-center justify-center mb-4 border border-emerald-200 bg-emerald-50 text-emerald-600 shadow-sm";
                icon.setAttribute('data-lucide', 'shield-check');
                title.textContent = "SAFE!";
                title.className = "text-3xl font-extrabold mb-2 text-emerald-600 tracking-tight";
                desc.textContent = "You passed this probability test! No homework check for you on this spin.";
                badge.textContent = "Safe (4 in 5 = 80% Chance)";
                badge.className = "font-bold text-emerald-600";
            }

            lucide.createIcons();
            modal.classList.remove('opacity-0', 'pointer-events-none');
            card.classList.remove('scale-90');
            card.classList.add('scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('resultModal');
            const card = document.getElementById('resultCard');
            card.classList.remove('scale-100');
            card.classList.add('scale-90');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        document.getElementById('spinBtn').addEventListener('click', startSpin);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target === document.body) {
                e.preventDefault();
                startSpin();
            }
        });

        document.querySelectorAll('.spin-speed-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.spin-speed-btn').forEach(b => {
                    b.className = 'spin-speed-btn px-3 py-1 rounded-lg bg-white text-slate-700 font-semibold border border-slate-200 shadow-sm';
                });
                e.target.className = 'spin-speed-btn px-3 py-1 rounded-lg bg-blue-600 text-white font-semibold border border-blue-600 shadow-sm';
                spinSpeedMode = e.target.getAttribute('data-speed');
            });
        });

        document.getElementById('soundToggleBtn').addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            const text = document.getElementById('soundText');

            if (soundEnabled) {
                icon.setAttribute('data-lucide', 'volume-2');
                icon.className = 'w-4 h-4 text-blue-600';
                text.textContent = 'Sound ON';
            } else {
                icon.setAttribute('data-lucide', 'volume-x');
                icon.className = 'w-4 h-4 text-slate-400';
                text.textContent = 'Muted';
            }
            lucide.createIcons();
        });

        document.getElementById('resetStatsBtn').addEventListener('click', () => {
            if (confirm("Are you sure you want to reset all classroom spin statistics back to zero?")) {
                totalSpins = 0;
                checkedCount = 0;
                localStorage.setItem('hinz_totalSpins', '0');
                localStorage.setItem('hinz_checkedCount', '0');
                updateStatsUI();
                saveStatsToCloud();
            }
        });

        document.getElementById('closeModalBtn').addEventListener('click', closeModal);
        document.getElementById('resultModal').addEventListener('click', (e) => {
            if (e.target.id === 'resultModal') closeModal();
        });

        window.onload = function() {
            lucide.createIcons();
            updateStatsUI();
            initCloudStorage();
            requestAnimationFrame(animateWheel);
        };
    </script>
